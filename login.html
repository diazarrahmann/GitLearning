<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | PT Denso Indonesia</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
                <div class="card border-0 shadow">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <h1 class="h3 fw-bold mb-2">Login</h1>

                            <p class="text-body-secondary mb-0">Silahkan masuk ke akun Anda</p>
                        </div>


                        <form id="loginForm">
                            <div class="mb-3">
                                <!-- NPK-->
                                <label for="npk" class="form-label fw-semibold">NPK</label>
                                <input type="text" class="form-control" id="npk" placeholder="Masukkan NPK" maxlength="7" required>
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                
                            <div class="position-relative">
                                <input type="password" class="form-control pe-5" id="password" placeholder="Masukkan password" required>
                                
                                <button type="button" id="togglePassword" class="btn position-absolute top-50 end-0 translate-middle-y me-2 p-0 border-0" aria-label="Tampilkan password">
                                    
                                    <i class="bi bi-eye"></i>
                                
                                </button>
                            </div>
                        </div>

                            <!-- Forgot Password -->
                            <div class="text-end mb-4">
                                <a href="forgotPassword.html" class="text-decoration-none">Lupa password?</a>
                            </div>

                            <!-- Login Button -->
                            <button type="submit" class="btn btn-primary w-100 py-2">Login</button>


                            <!-- Login Message -->
                            <div id="loginMessage" class="text-center mt-3"></div>
                        </form>


                        <!-- Register -->
                        <div class="text-center mt-4 pt-3 border-top">
                            <span class="text-body-secondary">Belum punya akun?</span>

                            <a href="register.html" class="text-decoration-none fw-semibold"> Daftar di sini</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="script.js"></script>
    
</body>
</html>
