<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lupa Password | PT Denso Indonesia</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <main class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
                <div class="card border-0 shadow">
                    <div class="card-body p-4 p-md-5">

                        <!-- Header -->
                        <div class="text-center mb-4">
                            <h1 class="h3 fw-bold mb-2">Lupa Password</h1>

                            <p class="text-body-secondary mb-0">Buat password baru</p>
                        </div>

                        <form id="forgotPasswordForm">
                            <!-- NPK -->
                            <div class="mb-3">
                                <label for="npk" class="form-label fw-semibold">NPK</label>
                                <input type="text" id="npk" class="form-control" placeholder="Masukkan NPK" maxlength="7" required>
                            </div>

                            <!-- Password Baru -->
                            <div class="mb-3">
                                <label for="newPassword" class="form-label fw-semibold">Password Baru</label>

                                <div class="position-relative">
                                    <input type="password" id="newPassword" class="form-control pe-5" placeholder="Masukkan password baru" minlength="8" required>

                                    <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y me-2 p-0 border-0" id="toggleNewPassword" aria-label="Tampilkan password">

                                        <i class="bi bi-eye-slash"></i>

                                    </button>
                                </div>
                            </div>

                            <!-- Konfirmasi Password -->
                            <div class="mb-4">

                                <labelfor="confirmPassword" class="form-label fw-semibold">Konfirmasi Password</labelfor=>

                                <div class="position-relative">

                                    <input type="password" id="confirmPassword"class="form-control pe-5" placeholder="Ulangi password baru" minlength="8" required>

                                    <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y me-2 p-0 border-0" id="toggleConfirmPassword" aria-label="Tampilkan password">

                                        <i class="bi bi-eye-slash"></i>

                                    </button>
                                </div>
                            </div>

                            <!-- Tombol -->
                            <button type="submit" class="btn btn-primary w-100 py-2">Ubah Password</button>

                            <!-- Pesan -->
                            <p id="forgotMessage" class="text-center mt-3"></p>
                        </form>

                        <!-- Kembali -->
                        <div class="text-center mt-4">
                            <a href="login.html" class="text-decoration-none">← Kembali ke Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/bootstrap.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
