<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | PT Denso Indonesia</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
                <div class="card border-0 shadow">
                    <div class="card-body p-4 p-md-5">

                        <!-- Header -->
                        <div class="text-center mb-4">
                            <h1 class="h3 fw-bold mb-2">Register</h1>

                            <p class="text-body-secondary mb-0">Buat akun baru</p>
                        </div>


                        <form id="registerForm">
                            <!-- NPK -->
                            <div class="mb-3">
                                <label for="npk" class="form-label fw-semibold">NPK</label>
                                <input type="text" id="npk" class="form-control" placeholder="Masukkan NPK" maxlength="7" required>
                            </div>


                            <!-- Password -->
                            <div class="mb-3">

                                <label for="password" class="form-label fw-semibold">Password</label>

                                <div class="position-relative">
                                    <input type="password" id="password" class="form-control pe-5" placeholder="Masukkan password" minlength="8" required>

                                    <button type="button" id="togglePassword" class="btn position-absolute top-50 end-0 translate-middle-y me-2 p-0 border-0" aria-label="Tampilkan password">

                                        <i class="bi bi-eye-slash"></i>

                                    </button>
                                </div>
                            </div>


                            <!-- Konfirmasi Password -->
                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label fw-semibold">Konfirmasi Password</label>
                                <div class="position-relative">
                                    <input type="password" id="confirmPassword" class="form-control pe-5" placeholder="Ulangi password" minlength="8" required>

                                    <button type="button" id="toggleConfirmPassword" class="btn position-absolute top-50 end-0 translate-middle-y me-2 p-0 border-0" aria-label="Tampilkan password">
                                        <i class="bi bi-eye-slash"></i>
                                    </button>
                                </div>
                            </div>


                            <!-- Daftar -->
                            <button type="submit" class="btn btn-primary w-100 py-2">Daftar</button>

                            <!-- Pesan -->
                            <p id="registerMessage" class="text-center mt-3"></p>
                        </form>


                        <!-- Kembali ke Login -->
                        <div class="text-center mt-4 pt-3 border-top">

                            <span class="text-body-secondary">Sudah punya akun?</span>
                            <a href="login.html" class="text-decoration-none fw-semibold">Login di sini</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/bootstrap.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
